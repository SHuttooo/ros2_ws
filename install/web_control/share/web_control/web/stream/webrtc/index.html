<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebRTC - Flux Robot</title>
    <style>
      body { margin: 0; font-family: Arial, sans-serif; background: #111; color: #eee; }
      header { padding: 12px 16px; background: #1c1c1c; }
      main { display: grid; place-items: center; height: calc(100vh - 52px); }
      video { max-width: 96vw; max-height: 90vh; background: #000; border-radius: 8px; }
      .status { font-size: 12px; opacity: 0.8; }
    </style>
  </head>
  <body>
    <header>
      <div>WebRTC - Flux Robot</div>
      <div class="status" id="status">Connexion...</div>
    </header>
    <main>
      <video id="video" autoplay playsinline muted></video>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
